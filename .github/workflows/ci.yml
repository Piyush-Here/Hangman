name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile
        run: javac -Xlint:all -d out src/*.java test/*.java
      - name: Run tests
        run: java -ea -cp out HangmanGameTest
